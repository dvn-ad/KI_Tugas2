version: '3.8'

networks:
  ki_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  kdc:
    build: .
    container_name: kdc_node
    command: sleep infinity
    networks:
      ki_network:
        ipv4_address: 172.20.0.10
    ports:
      - "7000:7000"

  bob:
    build: .
    container_name: bob_node
    command: sleep infinity
    networks:
      ki_network:
        ipv4_address: 172.20.0.12
    ports:
      - "8000:8000"

  alice:
    build: .
    container_name: alice_node
    command: sleep infinity
    networks:
      ki_network:
        ipv4_address: 172.20.0.11